<!doctype html>

<head>

<meta name="description" content="방화벽 정책 자동화와 보안 운영 도구를 만드는 이인직의 포트폴리오.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<body>

<a class="skip-link" href="#main">본문으로 바로가기</a>

<div class="spine" aria-hidden="true"><svg viewBox="0 0 2 100" preserveAspectRatio="none"><line id="spine-line" x1="1" y1="0" x2="1" y2="100" vector-effect="non-scaling-stroke"/></svg></div>

<header class="topbar">
  <span class="topbar-name">이인직</span>
  <nav class="topbar-nav" aria-label="섹션 이동">
    <a href="#about">About</a>
    <a href="#changelog">Changelog</a>
    <a href="#ai-skill">AI Skill</a>
  </nav>
</header>

<main id="main">

  <section class="hero" id="top">
    <div class="hero-node" aria-hidden="true"></div>
    <div class="hero-photo">
      <img id="profile-photo" src="assets/img/profile/placeholder.svg" alt="이인직 프로필 사진">
    </div>
    <div class="hero-copy">
      <p class="hero-role" id="profile-role">보안 정책 자동화 엔지니어</p>
      <h1 class="hero-name" id="profile-name">이인직</h1>

      <p class="hero-subhead" id="profile-subhead">정책 생성, 보안 점검, 변경 이력 관리를 AI와 자동화로 다시 설계합니다.</p>
    </div>
  </section>

  <section class="block" id="about">
    <div class="block-node" aria-hidden="true"></div>
    <h2 class="block-title">About</h2>
    <dl class="spec-sheet" id="about-sheet">
      <!-- rendered by main.js -->
    </dl>
  </section>

  <section class="block" id="changelog">
    <div class="block-node" aria-hidden="true"></div>
    <h2 class="block-title">Changelog</h2>
    <p class="block-lede">회사에서 맡아온 프로젝트를 변경 이력처럼 기록합니다.</p>
    <ol class="changelog-list" id="changelog-list">
      <!-- rendered by main.js -->
    </ol>
  </section>

  <section class="block" id="ai-skill">
    <div class="block-node" aria-hidden="true"></div>
    <h2 class="block-title">AI Skill</h2>
    <p class="block-lede">직접 만들어 쓰고 있는 AI 활용 도구들입니다.</p>
    <div class="skill-list" id="skill-list">
      <!-- rendered by main.js -->
    </div>
  </section>

</main>

<footer class="site-footer">
  <span id="footer-email-wrap"></span>
  <a class="admin-link" href="admin/">관리자</a>
